version: '3.8'

services:
  # === PLC Simulator (dùng để test, thay thế PLCSIM thật) ===
  plc-simulator:
    build:
      context: ./plc-simulator
      dockerfile: Dockerfile
    container_name: plc-simulator
    ports:
      - "102:102"    # S7 Protocol port
    restart: unless-stopped

